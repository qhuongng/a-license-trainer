<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện thi GPLX hạng A &amp; A1</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#00008b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GPLX A/A1" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .q-type-regular { font-size: 14px; font-weight: 300; line-height: 1.4; font-style: italic; color: dimgrey; }
    .q-type-critical { font-size: 14px; font-weight: 300; line-height: 1.4; font-style: italic; color: red; }
    .q-stem { font-size: 24px; font-weight: 700; color: darkblue; line-height: 1.3; }
    .q-answer { font-size: 18px; padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e7eb; cursor: pointer; transition: background 0.15s; }
    .q-answer:hover:not(.locked) { background: #f3f4f6; }
    .q-answer.correct { font-weight: 600; color: white; background: green; border-color: green; }
    .q-answer.wrong   { font-weight: 600; color: white; background: #dc2626; border-color: #dc2626; }
    .q-answer.locked { cursor: default; }
    .q-image { margin: 16px 0; }
    .q-image img { max-width: 100%; height: auto; border-radius: 8px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-center text-gray-800">
  <div id="app" class="max-w-3xl mx-auto px-6 py-4 md:p-8"></div>
  <script type="module" src="./scripts/firebase.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
